# PatrolBot undock hardware profile.
#
# Deployed to /home/ros/patrolbot_hw_server/undock_profile.conf.
# Read once at server start. Missing file or missing key => the built-in
# default, which for every *_valid flag is 0 (fail closed).
#
# A production UNDOCK is REFUSED with HARDWARE_PROFILE_UNCOMMISSIONED unless
# bumper_mapping_valid, rear_sonar_mapping_valid and estop_semantics_valid are
# all 1. A bounded validation_mode goal (<= 0.10 m, <= 0.05 m/s) is the only
# exception, so the commissioning session can exercise the real operation.
#
# Only set a *_valid flag to 1 once the value beside it has been physically
# measured on this robot. These flags are the difference between "we believe"
# and "we measured".

# --- Bumper mapping: MEASURED ----------------------------------------------
# Regression re-run 2026-07-29 (commission_passive.csv, 300 s @ 25 Hz, docked,
# motors disabled). All six front bits (9-14) and all six rear bits (1-6) were
# observed INDIVIDUALLY as isolated stall_value words, stall_value returned to
# 0x0 between presses, and no bit stayed asserted at rest. The "constant high
# bit" noted in bridge_node.py does not reproduce on this robot.
#
# Also measured: baseline docked stall_value is 0x0, i.e. this dock does NOT
# hold a front bumper panel. Redock detection therefore relies on the
# stationary-dwell path rather than on contact bits.
bumper_mapping_valid = 1
front_bumper_mask = 0x7e00
rear_bumper_mask = 0x007e

# --- Rear sonar: MEASURED 2026-07-29 ---------------------------------------
# ONLY THREE OF SIXTEEN SONAR REPORT ON THIS ROBOT.
#
# Over a 300 s capture, indices 0-10, 14 and 15 never updated their reading
# timestamp once (age stayed at the full run duration, range constant 5000 mm).
# Only 11, 12 and 13 are live:
#
#   idx 11  x=-263 y=-46  th=-170   straight back, right of centre
#   idx 12  x=-263 y= 46  th= 170   straight back, left of centre
#   idx 13  x=-232 y=134  th= 150   rear-left diagonal
#
# Index 10 (-150 deg) is DEAD, so it must NOT be listed: all_required_sensors_
# fresh would then be permanently false and every undock would be refused.
#
# KNOWN GAP: the rear-RIGHT quadrant is unsensed, because 9 (-125) and 10
# (-150) are both dead. 11 and 12 cover the swept width of a STRAIGHT reverse,
# which is the only motion this operation performs, but any future manoeuvre
# that arcs rearward would be blind on that side.
#
# Freshness: in steady state index 11 updated every 60 ms (p50), 76 ms (p99),
# 91 ms worst case over 2491 updates. The only staleness in the whole capture
# was a single 1.12 s window immediately after ARIA connected, which is a
# startup artifact; an undock requested in that window is refused by the
# precheck and clears on its own. 500 ms leaves 5.5x margin on the measured
# worst case.
#
# Near-field: the smallest range any live rear unit ever reported was 177 mm.
# The floor is set just above that so an edge-of-range reading is treated as
# unreliable, which blocks motion. Anything closer than rear_stop_range_m
# blocks on range anyway, so the two never disagree in a dangerous direction.
#
# Note: this robot reports 5000 mm for "no echo", not the 4335 mm sentinel the
# server assumes. Both read as "far", so there is no functional difference.
rear_sonar_mapping_valid = 1
rear_sonar_indices = 11,12,13
rear_near_field_floor_m = 0.20
rear_stop_range_m = 0.25
rear_sonar_fresh_ms = 500

# --- E-stop semantics: MEASURED 2026-07-29 ---------------------------------
# isEStopPressed() is the PHYSICAL RED BUTTON, not a charging interlock.
#
# Docked and charging with the button released, estop reads 0. Pressing it
# produced exactly one 0->1 transition and releasing it exactly one 1->0, with
# flags going 1028 -> 1060; the difference is 0x20, i.e. SIP flags bit 5, which
# is precisely what ArRobot::isEStopPressed() tests. motors_enabled stayed 0
# and fault_flags stayed 0 across both. The earlier audit note of "estop=1,
# motors=0 while docked" was simply the button being pressed at the time.
#
# SIDE EFFECT WORTH KNOWING: pressing the E-stop also asserts BOTH wheel-stall
# bits (stall_value 0x0101). Every one of the 453 stall-bit samples fell inside
# the E-stop window and none outside it, so wheelStalled() is not independent
# of the E-stop on this robot. safetyTripped() checks E-stop before stall, so
# the reported abort reason is still the correct one.
estop_semantics_valid = 1

# --- Fault masks -----------------------------------------------------------
# Explicit, not "any nonzero". Bits from the decoded FAULTFLAGS table
# (PatrolBot 3rd Gen Guide pp. 60-61).
#   critical (abort in motion): bit 2 general_pdb_failure,
#     bit 8 encoder_failure, bit 9 critical_driving_fault,
#     bit 15 jodrive_safe_mode
#   precheck also blocks: bit 4 gyro_fault, bit 7 encoder_degraded_warning
# low_battery (bit 3) and high_temperature (bit 1) are deliberately excluded:
# a docked robot legitimately reports them.
critical_fault_mask = 0x8304
precheck_blocking_fault_mask = 0x8394

# --- Release and motion timing: MEASURED 2026-07-29 ------------------------
# From commission_charge.csv, one CHARGE 0 sent while docked, stationary and
# motor-disabled:
#
#   CHARGE 0 sent        t = 0
#   charge_state 2 -> 0  t = +3552 ms     <-- release latency
#   charge_state 0 -> 3  t = +6656 ms     <-- re-latch, 3072 ms zero window
#
# THE PREVIOUS DEFAULT OF 300 ms WAS WRONG BY A FACTOR OF TWELVE. RELEASING
# would have exhausted all three retries in about 1.4 s, well before the charge
# ever dropped, and every undock would have failed with RELEASE_FAILED that
# looked like a hardware fault rather than a bad constant.
#
# 5000 ms is the measured 3552 ms plus ~40% margin. Worst case in RELEASING is
# then 4 x 5 s = 20 s, which still fits inside undock_max_duration.
release_observe_ms = 5000
# The measured zero window is 3.07 s wide, so the controller's "falling edge or
# one valid zero sample" rule has ample room. It is kept rather than switched to
# a multi-sample dwell because it is the safer rule if another base releases
# only briefly.
min_motion_m = 0.01
# MOST LIKELY VALUE TO NEED REVISITING after the first real reverse. If the base
# refuses to turn the wheels while charge is still asserted, no-motion recovery
# fires at 1500 ms and each retry then costs another release latency.
motion_check_ms = 1500

# --- Motion limits ---------------------------------------------------------
# max_speed_mps is a HARDWARE CEILING, not a tuning knob. Measured 2026-07-28:
# at 0.20 m/s the base re-latched charge and cut the motors 0.24 m in.
max_clearance_m = 0.70
max_speed_mps = 0.10
max_timeout_s = 60.0
# MEASURED 2026-07-29: this dock twists the robot about 12 degrees while the
# charger is still engaged, confirmed independently by AMCL (-91.33 -> -102.95
# deg) at 0.147 m of reverse. That rotation is imposed by the fixture, not
# chosen by the controller, so heading and lateral deviation are measured from
# a SECOND reference taken when the robot comes free, not from the docked pose.
# Distance is still measured from the dock, because that is what clearance
# means. The first production attempt aborted with heading_error_exceeded
# precisely because it policed the fixture's rotation.
max_lateral_drift_m = 0.06
max_departure_yaw_rad = 0.12
# The guard engages when the contacts are observed released, or at this reverse
# progress if that has not happened yet, whichever comes first. Charge was still
# asserted at 0.147 m on this dock, so the fallback must be beyond that.
pose_guard_start_m = 0.25
braking_margin_m = 0.10
sonar_uncertainty_m = 0.05
# Raised from 400 ms: a resend cannot act faster than the 3552 ms release
# latency measured above, so a tighter interval only queues redundant commands.
charge_resend_min_ms = 2000
max_release_attempts = 3
debounce_cycles = 3
lease_max_age_ms = 250
clearance_extension_m = 0.05
redock_dwell_ms = 2000
validation_max_clearance_m = 0.10
validation_max_speed_mps = 0.05

# --- Redock inhibition policy: UNVALIDATED ---------------------------------
# ARNL's minimum interval between automatic docking attempts. Inhibited until
# BOTH the time has passed AND the robot is this far from where the departure
# began. Not yet matched to the dock's capture area or the battery policy.
redock_inhibit_ms = 60000
redock_inhibit_m = 0.50
