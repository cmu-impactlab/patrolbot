cmd_vel_mux:             # Must match the 'name' in your launch file
  ros__parameters:
    use_stamped: false
    topics:              # Changed from 'subscribers'
      safety_controller: # Unique key for each source
        topic: "input/safety_controller"
        timeout: 0.2
        priority: 10
      undock_turn:
        # The bridge renews this only for its owned, collision-filtered Spin.
        topic: "input/undock_turn"
        timeout: 0.25
        priority: 9
      teleop:
        # Dashboard on-screen deadman teleop (patrolbot_web_bridge). Strictly
        # below the F710 on input/joy (8) so the joystick always wins, and
        # above navigation (5) so a held deadman outranks autonomy. The web
        # bridge zeroes this input at its fail-closed 300 ms watchdog; the
        # 1.0 s timeout only releases the slot after that zero.
        topic: "input/teleop"
        timeout: 1.0
        priority: 7
      joy:
        topic: "input/joy"
        # Slightly above the teleop's 0.4 s receiver watchdog. Once its final
        # zero lands, manual ownership releases promptly without reviving a
        # prior Nav2 goal (RB takeover cancels that goal explicitly).
        timeout: 0.5
        priority: 8
      switch:
        topic: "input/switch"
        timeout: 1.0
        priority: 6
      navigation:
        topic: "input/navi"
        timeout: 1.0
        priority: 5
