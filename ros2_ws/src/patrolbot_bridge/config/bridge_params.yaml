patrolbot_bridge:
  ros__parameters:
    # Physically mapped 2026-07-23, charging and motor-disabled. The operator
    # pressed all six front panels left-to-right, then all six rear panels
    # left-to-right. Front uses SIP stall bits 9-14; rear uses bits 1-6.
    # The dock normally holds the two center-front panels (0x1800) active.
    bumpers_mapped: true
    front_bumper_mask: 32256  # 0x7e00
    rear_bumper_mask: 126     # 0x007e
    # Candidate commissioning topic only. It is never an active safety source
    # until physical self-occlusion testing explicitly approves it.
    publish_unfiltered_scan_candidate: false
    unfiltered_scan_topic: "/scan_unfiltered_candidate"

    # ------------------------------------------------------------------
    # /odom covariance. Measured by the operator, 2026-08-18.
    # ------------------------------------------------------------------
    # /odom previously carried 36 zeros in both covariance blocks. That is not
    # "unknown" -- it asserts the wheel odometry is exact, and a zero matrix is
    # singular, so any estimator that weights the measurement by inverting it
    # fails outright. These sigmas are what the bridge says instead.
    #
    # They are per-unit-of-motion, not absolute. Variance accumulates linearly
    # in distance driven and angle turned, so the 1-sigma error after driving
    # D metres is sigma_xy_per_m * sqrt(D).
    #
    # Measured: ~5 cm 1-sigma position error over 10 m, ~2 deg over a full
    # in-place turn. Re-measure and update here after any change to the base's
    # TicksMM/RevCount/DriftFactor calibration (currently 189/30127/32) or
    # after a wheel or tyre change. Do not hand-tune these to make a downstream
    # estimator behave -- they are a measurement, not a knob.
    odom_sigma_xy_per_m: 0.016      # 1-sigma ~5 cm after 10 m
    odom_sigma_yaw_per_rad: 0.014   # 1-sigma ~2 deg after one full turn
    # Heading error bled in by driving straight: unequal wheel diameters turn a
    # commanded straight line into a slow arc. This is AMCL's **alpha2** term
    # (rotation noise from translation). Corrected 2026-08-21 -- this comment
    # previously said alpha4, which is the opposite direction of the same
    # coupling: alpha4 is translation noise caused by rotation.
    odom_sigma_yaw_per_m: 0.004
    # Instantaneous velocity noise. Constant -- velocity is measured fresh each
    # frame rather than integrated, so its error does not compound.
    odom_sigma_vx: 0.02
    odom_sigma_vyaw: 0.02
    # Floor keeps the matrix invertible before the robot has moved at all.
    odom_min_variance: 1.0e-6
    # Ceiling matters because this robot runs for weeks between restarts;
    # unbounded linear growth would reach magnitudes that wreck the
    # conditioning of anything the value is multiplied into.
    odom_max_variance: 1.0

    # Semantic odometry validation. These mirror source-enforced contracts,
    # not guessed physical values: patrolbot_server accepts DRIVE only through
    # 0.30 m/s and 1.20 rad/s and emits telemetry every 50 ms. Continuity
    # allowance is speed * (observed elapsed time + one sample period).
    odom_max_linear_speed: 0.30
    odom_max_angular_speed: 1.20
    odom_expected_period: 0.05
