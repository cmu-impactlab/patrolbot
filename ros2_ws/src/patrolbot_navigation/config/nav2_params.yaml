amcl:
  ros__parameters:
    use_sim_time: False
    # Motion-model noise. alpha1 (rotation noise from rotation) and alpha4
    # (translation noise from rotation) dominate during the undock's in-place
    # 180 deg turn, which is where the estimate was seen wandering worst.
    # Halved so a pure rotation spreads the particle cloud far less.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    # alpha5 is unused by DifferentialMotionModel (only used by omni drive) —
    # zeroed rather than left at a value that never does anything.
    alpha5: 0.00
    base_frame_id: "base_link"
    beam_skip_distance: 0.50
    beam_skip_error_threshold: 0.90
    beam_skip_threshold: 0.30
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.10
    laser_likelihood_max_dist: 2.00
    laser_max_range: -1.0
    laser_min_range: -1.0
    # Changed from "likelihood_field" to "likelihood_field_prob": this is a
    # different sensor model (adds beam-skip-aware probability weighting), not
    # a value tweak on the same model. Re-validate localization behavior after
    # this, ideally against the same undock/spin scenario that drove alpha1/4.
    laser_model_type: "likelihood_field_prob"
    # Required by likelihood_field_prob: number of evenly distributed scan
    # beams AMCL actually evaluates per update.
    max_beams: 60
    # Particle count raised 500-1500 -> 1000-4000. That's up to 2.7x the worst
    # case particle count, i.e. more CPU per update — worth watching given the
    # SBC/Pi is already flagged elsewhere in this file as load-sensitive
    # (see local_costmap's always_send_full_costmap note).
    max_particles: 4000
    min_particles: 1000
    map_topic: "map"
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # 20261014 jump-limit: recovery injection DISABLED (Nav2 defaults 0.0).
    # Random-particle injection teleports the filter (0.52 m snap seen
    # 20261014 across re-seed). Re-seed is explicit-only via dock initializer
    # / operator; bridge innovation gate (0.10/0.20 m, 3/5 deg) stays the guard.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    # 20261014 AMCL retune (office/university, good odom): sigma_hit 0.30 -> 0.20.
    # Consensus default 0.20; tighter laser noise suits clean indoor SICK LMS-200.
    sigma_hit: 0.20
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_d: 0.10
    update_min_a: 0.10
    z_hit: 0.50
    # z_max/z_short are unused by likelihood_field_prob (it only consumes
    # z_hit + z_rand, which correctly sum to 1.0) — zeroed to reflect that.
    # Note lambda_short (above) is ALSO unused by likelihood_field_prob but was
    # left at 0.10 rather than zeroed in the source values you gave me: that's
    # an inconsistency in the new config itself, not something I introduced.
    z_max: 0.00
    z_rand: 0.50
    z_short: 0.00
    scan_topic: "scan"
    first_map_only: true
    freespace_downsampling: false
    bond_heartbeat_period: 0.1
    allow_parameter_qos_overrides: true
    # Never claim map origin after a restart. A valid pose must come from the
    # operator or the guarded dock-pose initializer after it has proved the
    # robot is on a known dock. Navigation/undock readiness remains false until
    # that input converges and passes the localization-health checks.
    set_initial_pose: false
    always_reset_initial_pose: false
    initial_pose: [0.0, 0.0, 0.0, 0.0]
 
behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"
    cycle_frequency: 10.0
    # Bound for the post-undock turn away from the dock. The SBC no longer
    # grants a scoped turn authorization at all: by the time this Spin runs it
    # has handed motion authority back with its dock observer in
    # CLEAR_CONFIRMED, so this is an ordinary Nav2 behavior on the full safety
    # chain. Kept at the previously commissioned value.
    max_rotational_vel: 0.7
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      # BackUp remains available as a Nav2 recovery behavior. It is NOT used
      # to separate the robot from the charging contacts any more: that is the
      # SBC's exclusive UNDOCK operation, which owns the wheels directly.
      minimum_speed: 0.05
      acceleration_limit: 0.4
      deceleration_limit: -0.5
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "odom"
    bt_loop_duration: 10
    default_server_timeout: 20
    error_code_name_prefixes: ["follow_path", "compute_path", "backup", "spin", "wait"]
    default_nav_to_pose_bt_xml: "$(find-pkg-share patrolbot_navigation)/config/behavior_trees/navigate_recovery_always_try.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share patrolbot_navigation)/config/behavior_trees/navigate_through_poses_recovery_always_try.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.50
      state_tolerant_time_allowance: 1.0
    # Regulated Pure Pursuit (RPP) — replaced un-tuned DWB 2026-06-29. DWB scored the
    # near-stationary trajectory best (commanded ~0.05 rad/s, below the base deadband) so
    # the robot never moved → "Failed to make progress". RPP rotates IN PLACE to face the
    # path at a real, above-deadband speed, then drives — robust for this 0.26 m/s diff-drive.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22          # cruise speed (base max 0.26 m/s)
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: false
      # In-place rotation when the path heading is off by > ~40 deg (the start case that
      # stalled DWB). 0.9 rad/s is well above the base's rotational deadband.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.70
      rotate_to_heading_angular_vel: 0.9
      max_angular_accel: 3.2
      allow_reversing: false
      # Final-approach slowdown — keep min above the base deadband so it still actuates.
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      # Slow on tight curves (regulated); cost-scaling off (handled by costmap inflation).
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: false
      # Forward collision check DISABLED 2026-06-29: RPP's footprint check treats the
      # inscribed band (cost 253, ~0.213 m = robot half-width) around obstacles as a
      # collision, so it froze mid-doorway on any door narrower than ~0.85 m clear even
      # though the 0.43 m robot physically fits. The collision_monitor stop_box (±0.3 m
      # hard-stop) is now the sole automatic collision guard in the nav path.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 2.0

docking_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["charging_dock"]
    charging_dock:
      # This plugin remains dormant while docking_server is disabled. Unlike
      # SimpleChargingDock, it never infers charging from BatteryState.current;
      # fresh typed BaseState is authoritative and /battery freshness confirms
      # that the bridge's auxiliary telemetry path is alive.
      plugin: "patrolbot_docking_plugins::PatrolBotChargingDock"
      telemetry_timeout: 0.5
      release_timeout: 7.0
      staging_x_offset: -0.7
      staging_yaw_offset: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      # Stream the full costmap every cycle (not latched-once) so a remote/late RViz
      # over the LAN reliably receives it — fixes RViz "No map received" for costmaps.
      always_send_full_costmap: True
      global_frame: "odom"
      transform_tolerance: 1.0
      # Wait (effectively) forever for the odom->base_link TF during activation
      # instead of aborting. If the navigation stack (re)starts while the SBC is
      # down/disconnected, the bridge isn't publishing odom yet, so the costmap
      # has no base_link->odom transform. With the default (~3 s) timeout the
      # costmap activation FAILED -> lifecycle_manager "Aborting bringup" -> the
      # container stayed alive but EMPTY, so systemd never restarted it and Nav2
      # never recovered even after the SBC came back. The lifecycle_manager blocks
      # indefinitely on each node's activation (change_state has no timeout), so a
      # huge value here just makes bringup PARK until the SBC returns, then it
      # activates cleanly with zero intervention. ~11.5 days = any realistic outage.
      initial_transform_timeout: 1000000.0
      robot_base_frame: "base_link"
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.1
      # Octagonal footprint from the robot's own ARIA params (patrolbot-sh.p):
      # RobotLength 510 mm (=+/-0.255 x), RobotWidth 425 mm (=+/-0.2125 y),
      # corner vertices at the user-guide swing radius 0.29 m. Replaces the old
      # robot_radius: 0.22 which only covered the half-WIDTH and left the front
      # (laser) and rear (sonar) ends ~3-7 cm outside the modeled footprint.
      footprint: "[[0.255, 0.138], [0.197, 0.213], [-0.197, 0.213], [-0.255, 0.138], [-0.255, -0.138], [-0.197, -0.213], [0.197, -0.213], [0.255, -0.138]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          # Seconds without a scan before the observation buffer is flagged
          # not-current (costmap.isCurrent() -> false). /scan runs ~20 Hz, so 0.5 s
          # = 10 missed scans: a real laser/link loss, not a hiccup. The safety
          # watchdog stops the robot on the same event; this is defence in depth so
          # the costmap never plans on a stale obstacle snapshot.
          expected_update_rate: 0.5
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 20261014 consensus (Zheng/Nav2 guides): gentler decay centers paths in
        # halls; radius kept 0.40 so 0.85 m doors stay passable for the 0.43 m base.
        cost_scaling_factor: 3.0
        inflation_radius: 0.40

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      # NOTE: do NOT set always_send_full_costmap here. The StaticLayer forces this global
      # costmap to the MAP's resolution (0.075 m) → 3192×2205 ≈ 6 MB per message. Streaming
      # that every cycle re-saturates the Pi/WiFi (load spikes, /scan jitter → watchdog
      # holds) even on the LAN. The robot's immediate drivable area is shown by the LIGHT
      # rolling local_costmap instead; the whole-building walls come from the static map.
      transform_tolerance: 1.0
      # Wait (effectively) forever for the base_link->map TF during activation
      # instead of aborting bringup — see the long note in local_costmap above.
      # global needs map->odom (AMCL) + odom->base_link (bridge); both are absent
      # while the hardware link is silent, so without this the stack permanently gives up.
      initial_transform_timeout: 1000000.0
      global_frame: "map"
      robot_base_frame: "base_link"
      use_sim_time: False
      # Octagonal footprint — same as local_costmap (see note there). From ARIA
      # params + 0.29 m swing radius; replaces undersized robot_radius: 0.22.
      footprint: "[[0.255, 0.138], [0.197, 0.213], [-0.197, 0.213], [-0.255, 0.138], [-0.255, -0.138], [-0.197, -0.213], [0.197, -0.213], [0.255, -0.138]]"
      resolution: 0.2
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          # Seconds without a scan before the observation buffer is flagged
          # not-current (costmap.isCurrent() -> false). /scan runs ~20 Hz, so 0.5 s
          # = 10 missed scans: a real laser/link loss, not a hiccup. The safety
          # watchdog stops the robot on the same event; this is defence in depth so
          # the costmap never plans on a stale obstacle snapshot.
          expected_update_rate: 0.5
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 20261014 consensus (Zheng/Nav2 guides): gentler decay centers paths in
        # halls; radius kept 0.40 so 0.85 m doors stay passable for the 0.43 m base.
        cost_scaling_factor: 3.0
        inflation_radius: 0.40

map_server:
  ros__parameters:
    use_sim_time: False

planner_server:
  ros__parameters:
    use_sim_time: False
    costmap_update_timeout: 3.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

route_server:
  ros__parameters:
    use_sim_time: False
    graph_loaders: ["GeoJsonGraphFileLoader"]
    GeoJsonGraphFileLoader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"
    scorers: ["DistanceScorer", "DynamicEdgesScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    DynamicEdgesScorer:
      plugin: "nav2_route::DynamicEdgesScorer"
    operations: ["AdjustSpeedLimit", "ReroutingService"]
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    ReroutingService:
      plugin: "nav2_route::ReroutingService"

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_iterations: 500
      w_data: 0.2
      w_smooth: 0.3

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    odom_topic: "odom"
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: False
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      time_to_wait: 0.0

patrolbot_safety_watchdog:
  ros__parameters:
    scan_timeout: 0.5
    odom_timeout: 0.5
    battery_timeout: 1.0
    base_state_timeout: 0.75
    battery_stop_voltage: 23.0
    stop_on_faults: true
    stop_on_estop: true
    # Implemented but intentionally not commissioned. Enabling this with zero
    # masks makes the watchdog hold fail-closed until every bumper is mapped.
    bumper_enforcement_enabled: false
    rate: 10.0

patrolbot_controller_feedback:
  ros__parameters:
    intensity: 1.0
    event_pulse: 0.6
    retry_pulse: 0.35
    retry_interval: 1.5
    startup_grace: 2.0
    joystick_timeout: 0.4
    deadzone: 0.12

patrolbot_dock_manager:
  ros__parameters:
    # Captured exactly from the operator's RViz /initialpose while seated in
    # the main charger on 2026-08-27. Charging and dock residence never publish
    # this autonomously; the guarded initializer remains explicit-only.
    dock_pose_configured: true
    dock_id: "main_charger"
    dock_pose_x: 100.37
    dock_pose_y: 126.63
    dock_pose_yaw: -1.842
    # The dock has real capture range — the robot mates and charges from a
    # spread of approach positions, not one surveyed point. 0.25 m was tighter
    # than the hardware: a hand-placed, charging robot measured 0.32 m from the
    # configured pose and was refused. 0.60 m covers the observed spread while
    # still catching a pose estimate that has genuinely diverged (the dock is
    # nowhere near anything else the robot could be sitting on).
    dock_position_tolerance: 0.60
    dock_yaw_tolerance: 0.35
    max_position_variance: 0.25
    # PB-AUDIT-026. Docked, AMCL's x-variance sampled 0.57-0.63 across 70 forced
    # no-motion updates and never converged, because the dock fills the laser's
    # near field and nothing constrains the approach axis. yy stayed at 0.001,
    # yaw at 0.0003, and the pose was accurate to ~6 cm against the surveyed
    # dock pose, so this is dock geometry rather than a lost robot. 1.0 clears
    # the worst measured sample with headroom while still refusing an estimate
    # that has actually diverged. It applies ONLY while the SBC's dock observer
    # reports mated plates AND the pose already agrees with the surveyed dock
    # pose; max_position_variance above is unchanged and still gates general
    # navigation. Do not raise that one to solve a docked problem.
    docked_max_position_variance: 1.0
    max_yaw_variance: 0.25
    sensor_timeout: 0.5
    # Every explicit localization phase has its own bounded request budget.
    # Successfully dispatched service calls count; an unavailable service does
    # not consume the budget, and the existing phase timeout remains final.
    localization_update_max_attempts: 5
    precheck_timeout: 5.0
    # Requested of the SBC's exclusive UNDOCK operation. The SBC rejects
    # anything outside its own hard caps rather than clamping it, so these are
    # a request, not a guarantee.
    #
    # undock_reverse_speed is a HARDWARE CEILING, not a tuning knob. Measured
    # 2026-07-28: at 0.20 m/s the base re-latched charge and cut the motors
    # 0.24 m into the reverse.
    undock_clearance_distance: 0.53
    undock_reverse_speed: 0.10
    # Backstop only. The SBC owns the real operation timeout, its release
    # retries and its no-motion detection.
    undock_max_duration: 45.0
    # After the SBC confirms physical clearance and hands motion authority
    # back, turn away from the charger through Nav2's collision-checked Spin.
    # This deliberately stays on the Pi: the SBC is blind to the costmap, the
    # laser and the collision monitor, and a 180 degree in-place turn is a
    # navigation concern rather than a hardware-contact one.
    undock_turn_yaw: 3.141592653589793
    spin_timeout: 20.0
    dock_pose_initialization_timeout: 5.0
    initial_pose_xy_variance: 0.04
    initial_pose_yaw_variance: 0.0685

# PB-AUDIT-001 upstream autonomous-command arbiter. All Nav2 motion producers
# enter here before the navigation velocity smoother and collision monitor.
# The docking input stays publisher-free until a reviewed docking implementation
# is enabled. Short timeouts prevent stale commands from surviving a producer
# crash or a change in arbitration ownership.
nav_command_mux:
  ros__parameters:
    use_stamped: false
    topics:
      controller:
        topic: "input/nav_controller"
        timeout: 0.25
        priority: 5
      behavior:
        topic: "input/nav_behavior"
        timeout: 0.25
        priority: 7
      docking:
        topic: "input/docking"
        timeout: 0.25
        priority: 9

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    # Must match velocity_smoother's actual output. The smoother publishes
    # /cmd_vel_smoothed (its 'cmd_vel_topic' param is not a real nav2 param and is
    # ignored); collision_monitor previously read /cmd_vel_raw which had no
    # publisher, so nav commands never reached the robot.
    cmd_vel_in_topic: "cmd_vel_smoothed"
    # Nav2 output goes to twist_mux's navigation input (priority 5) instead of
    # straight to the robot, so the joystick (input/joy, priority 8) can override
    # it. twist_mux -> cmd_vel_out -> teleop_velocity_smoother -> /cmd_vel -> bridge.
    cmd_vel_out_topic: "input/navi"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    # Both automatic-motion sources are fail-closed. /scan is ~20-25 Hz and
    # /sonar is ~5 Hz; 0.5 s tolerates one missed sonar period but stops after
    # roughly 2-3 missed samples. Never set either timeout to zero.
    source_timeout: 0.5
    enable_stamped_cmd_vel: false
    # MUST stay False. With True, collision_monitor looks up laser_frame->odom at
    # each scan's exact timestamp to compensate for robot motion. After a bridge/SBC
    # reconnect there is a brief TF gap, so a scan can arrive stamped earlier than the
    # rebuilt TF cache -> tf2::BackwardExtrapolationException. collision_monitor does
    # NOT wrap this in a message filter, so the uncaught throw SIGABRTs the entire
    # composed nav2_container (every Nav2 node dies at once). False uses the latest
    # transform instead, which is fine at this robot's 0.26 m/s top speed (~1 cm of
    # motion per scan). This is the root cause of the TODO item-1 reconnect crash.
    base_shift_correction: False
    # Velocity-selected zones let a front-docked robot reverse straight away
    # from the dock wall without disabling front safety. Each polygon covers
    # the complete commanded envelope; sub-polygons are ordered so the shared
    # +/-0.01 m/s boundaries select rotation_or_stopped deterministically.
    polygons: ["front_velocity_stop", "rear_velocity_stop"]
    front_velocity_stop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 8
      sources_names: ["scan"]
      visualize: True
      polygon_pub_topic: "front_velocity_stop_polygon"
      holonomic: false
      velocity_polygons: ["rotation_or_stopped", "forward", "reverse"]
      rotation_or_stopped:
        points: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"
        linear_min: -0.01
        linear_max: 0.01
        theta_min: -1.0
        theta_max: 1.0
      forward:
        points: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"
        linear_min: 0.01
        linear_max: 0.26
        theta_min: -1.0
        theta_max: 1.0
      reverse:
        # During reverse, scan points at the dock wall in front are outside the
        # selected travel-direction zone; the front scanner remains fresh and
        # rotation/forward immediately restore the full front stop envelope.
        points: "[[-0.2, 0.3], [-0.2, -0.3], [-0.55, -0.3], [-0.55, 0.3]]"
        linear_min: -0.26
        linear_max: -0.01
        theta_min: -1.0
        theta_max: 1.0
    rear_velocity_stop:
      type: "velocity_polygon"
      action_type: "stop"
      # Four sparse transducers produce at most four live points; one credible
      # echo must be able to stop reverse motion.
      min_points: 1
      sources_names: ["sonar"]
      visualize: True
      polygon_pub_topic: "rear_velocity_stop_polygon"
      holonomic: false
      velocity_polygons: ["rotation_or_stopped", "forward", "reverse"]
      rotation_or_stopped:
        # Match the front rotation zone; the longer reverse zone keeps braking room.
        points: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"
        linear_min: -0.01
        linear_max: 0.01
        theta_min: -1.0
        theta_max: 1.0
      forward:
        # Rear sonar cannot see this front-only inactive envelope. It remains
        # fresh, while the scan polygon owns forward protection.
        points: "[[0.55, 0.3], [0.55, -0.3], [0.2, -0.3], [0.2, 0.3]]"
        linear_min: 0.01
        linear_max: 0.26
        theta_min: -1.0
        theta_max: 1.0
      reverse:
        points: "[[-0.2, 0.3], [-0.2, -0.3], [-0.55, -0.3], [-0.55, 0.3]]"
        linear_min: -0.26
        linear_max: -0.01
        theta_min: -1.0
        theta_max: 1.0
    observation_sources: ["scan", "sonar"]
    scan:
      type: "scan"
      topic: "/scan"
      source_timeout: 0.5
      enabled: True
    sonar:
      type: "pointcloud"
      topic: "/sonar"
      source_timeout: 0.5
      min_height: -0.1
      max_height: 0.5
      min_range: 0.0
      enabled: True

# NOTE: nav2_bringup does NOT load this params file into its lifecycle_manager
# nodes (it only passes autostart + node_names inline), so bond_timeout cannot be
# set here. The local patched launch files pass bond_timeout: 0.0 directly and
# load the Nav2 nodes into one composed container (see bringup.launch.py).
